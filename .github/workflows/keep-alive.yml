# Supabase pauses free-plan projects after about a week without activity.
# This pings the database twice a week so the site keeps working between monthly updates.
# It calls nw_ping(), which returns only the current time and reads none of your data.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 1 * * 1,4"   # 09:17 Singapore time, Mondays and Thursdays
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" js/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/nw_ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
